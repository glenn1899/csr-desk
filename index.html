<!DOCTYPE html>
<html lang="en">
<head>

<title>CSR Desk</title>
<meta name="description" content="CSR desk. The current time block, what to do in it, and a heads-up for the next block.">
<meta name="theme-color" content="#f3efe6">

<style>
  :root {

  function liveId(clock) {
    if (clock.weekday === "Sat" || clock.weekday === "Sun") return null;
    for (var i = 0; i < BLOCKS.length; i++) {
      if (clock.minutes >= BLOCKS[i].start && clock.minutes < BLOCKS[i].end) return BLOCKS[i].id;
    }
    return null;
  }
  function until(target, clock) { return (target - clock.minutes) * 60 - clock.seconds; }
  function span(total) {
    var sec = Math.max(0, total);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (sec < 15 * 60) return m + "m " + String(s).padStart(2, "0") + "s";
    if (h > 0) return m > 0 ? h + "h " + m + "m" : h + "h";
    return m + "m";
  }
  function progress(block, clock) {
    var origin = block.progressFrom == null ? block.start : block.progressFrom;
    if (clock.minutes < origin) return 0;
    var width = (block.end - origin) * 60;
    if (width <= 0) return 1;
    var elapsed = (clock.minutes - origin) * 60 + clock.seconds;
    return Math.max(0, Math.min(1, elapsed / width));
  }
  function restricted(mode) { return mode === "off" || mode === "overflow"; }
  function waitSpan(next) {
    var index = -1;
    for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].id === next.id) index = i;
    var prev = index > 0 ? BLOCKS[index - 1] : null;
    if (!prev) return Math.max(60, next.start * 60);
    var origin = prev.progressFrom == null ? prev.start : prev.progressFrom;
    return Math.max(60, (next.start - origin) * 60);
  }
  function phoneIcon(mode, small) {
    var html = mode === "off" ? PHONE_OFF : mode === "overflow" ? VOICE : PHONE;
    return small ? html.replace('class="icon', 'class="icon sm') : html;
  }
  function load(day) {
    try {
      var raw = localStorage.getItem("csr-desk-checks");
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.ymd !== day || !Array.isArray(parsed.ids)) return [];
      return parsed.ids.filter(function (id) { return typeof id === "string"; });
    } catch (e) { return []; }
  }
  function save(day, ids) {
    localStorage.setItem("csr-desk-checks", JSON.stringify({ ymd: day, ids: ids }));
  }
  function actionable(block, monday) {
    return block.tasks.filter(function (task) { return task.tag !== "note" && (!task.mondayOnly || monday); });
  }

  var marks = document.getElementById("marks");
  var tick = "";
  var nums = "";
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0;
    tick += '<line x1="0" y1="' + (major ? -146 : -151) + '" x2="0" y2="-156" transform="rotate(' + (i * 6) + ')" stroke="' + (major ? "#1c1b19" : "rgba(28,27,25,.38)") + '" stroke-width="' + (major ? 1.75 : 1) + '" vector-effect="non-scaling-stroke"/>';
  }
  for (var n = 1; n <= 12; n++) {
    var rad = ((n * 30 - 90) * Math.PI) / 180;
    nums += '<text x="' + (Math.cos(rad) * 116) + '" y="' + (Math.sin(rad) * 116) + '" fill="#1c1b19" font-size="33" text-anchor="middle" dominant-baseline="central" font-family="Source Sans 3, Segoe UI, sans-serif" font-weight="500">' + n + "</text>";
  }
  marks.innerHTML = tick + nums;

  function paintClock(date, clock) {
    var second = clock.seconds + (reduced ? 0 : date.getMilliseconds() / 1000);
    var min = clock.minute + second / 60;
    var hr = (clock.hour % 12) + min / 60;
    document.getElementById("hour").setAttribute("transform", "rotate(" + (hr * 30) + ")");
    document.getElementById("minute").setAttribute("transform", "rotate(" + (min * 6) + ")");
    document.getElementById("second").setAttribute("transform", "rotate(" + (second * 6) + ")");
    document.getElementById("face").setAttribute("aria-label", clock.timeLabel);
    document.getElementById("date").textContent = clock.dateLine;
  }

  function taskHtml(task, monday, interactive, clock, liveNow) {
    var inactive = !!(task.mondayOnly && !monday);
    var checkable = interactive && task.tag !== "note" && !inactive;
    var checked = checks.indexOf(task.id) >= 0;
    var late = liveNow && monday && task.dueBy != null && !checked && clock.minutes >= task.dueBy;
    var box = checkable
      ? '<button class="check" type="button" role="checkbox" aria-checked="' + checked + '" data-id="' + esc(task.id) + '" aria-label="' + esc(task.text) + '"><span class="box' + (checked ? " on" : "") + '">' + (checked ? CHECK : "") + "</span></button>"
      : '<span class="check" aria-hidden="true"><span class="box"></span></span>';
    return '<li class="task' + (inactive ? " dim" : "") + (checked ? " done" : "") + '">' + box +
      '<div class="task-body"><span class="tag' + (task.tag === "do" && !inactive ? " do" : "") + '">' + esc(inactive ? "Mon" : TAG[task.tag]) + "</span><div><p>" +
      (task.mondayOnly && monday ? '<span class="mon">Mon</span>' : "") + esc(task.text) + "</p>" +
      (task.dueBy != null ? '<p class="due' + (late ? " late" : "") + '">' + (late ? "This was due before 9:00." : "Due before 9:00.") + "</p>" : "") +
      "</div></div></li>";
  }

  function remainHtml(remain, total) {
    var fraction = Math.min(1, Math.max(0, remain / total));
    return '<div class="remain"><div class="track" aria-hidden="true"><span style="width:' + (fraction * 100) + '%"></span></div><b>' + esc(span(remain)) + "</b></div>";
  }

  function finishHtml() {
    var cells = "";
    for (var i = 0; i < 12; i++) {
      cells += '<rect x="' + (52 + i * (256 / 12)) + '" y="34" width="' + (256 / 12) + '" height="22" fill="' + (i % 2 ? "#fcfaf6" : "#1b1714") + '" stroke="#1b1714" stroke-width="1"/>';
    }
    return '<article class="card"><div class="pad"><p class="label">After 5:00</p><svg viewBox="0 0 360 128" style="display:block;width:100%;max-width:32rem;margin-top:2rem" aria-hidden="true"><line x1="20" y1="108" x2="340" y2="108" stroke="#e3d8c8" stroke-width="1.5"/><line x1="52" y1="108" x2="52" y2="22" stroke="#1b1714" stroke-width="3" stroke-linecap="round"/><line x1="308" y1="108" x2="308" y2="22" stroke="#1b1714" stroke-width="3" stroke-linecap="round"/><circle cx="52" cy="20" r="4" fill="#1b1714"/><circle cx="308" cy="20" r="4" fill="#1b1714"/>' + cells + '<path d="M176 86l6 8 14-16" fill="none" stroke="#9d2c1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 style="margin-top:1.5rem">Done for today</h1><p class="window" style="color:var(--ink)">No blocks left on this sheet.</p><p class="exit"><strong>Exit check. </strong>' + esc(EXIT) + "</p></div></article>";
  }

  function render(clock) {
    var focus = focusFor(clock);
    var nowId = liveId(clock);
    var interactive = !previewId && focus.kind === "block";
    var liveName = nowId ? BLOCKS.filter(function (b) { return b.id === nowId; })[0].title : (clock.weekday === "Sat" || clock.weekday === "Sun" ? "the weekend" : "after close");
    var html = "";
    if (previewId && focus.block) {
      html += '<div class="banner"><p>Previewing ' + esc(focus.block.window) + ". Live desk is " + esc(liveName) + '.</p><button type="button" id="back">Back to now</button></div>';
    }
    html += '<nav class="rail" aria-label="Day blocks">';
    BLOCKS.forEach(function (block) {
      var selected = focus.block && block.id === focus.block.id;
      var live = block.id === nowId;
      var past = clock.weekday !== "Sat" && clock.weekday !== "Sun" && clock.minutes >= block.end;
      html += '<button type="button" data-pick="' + esc(block.id) + '" aria-pressed="' + (selected ? "true" : "false") + '"' + (past && !selected ? ' class="past"' : "") + '><span class="win">' + (live ? '<span class="dot"></span>' : "") + esc(block.window) + '</span><span class="name">' + esc(block.short) + "</span></button>";
    });
    html += "</nav>";
    var closedNote = clock.weekday === "Sat" || clock.weekday === "Sun" ? "No blocks today." : clock.minutes >= 17 * 60 ? "Done for today." : "";
    if (closedNote && !previewId) html += '<p class="note">' + esc(closedNote) + "</p>";
    var lead = html;
    html = "";
    if (focus.kind !== "block" || !focus.block) {
      if (focus.kind === "weekend") {
        html += '<article class="card"><div class="pad"><p class="label">Weekend</p><h1>Office closed</h1><p class="window" style="color:var(--ink)">No blocks today.</p></div></article>';
      } else {
        html += finishHtml();
      }
    } else {
      var block = focus.block;
      var left = previewId ? null : until(block.end, clock);
      var bar = previewId ? 0 : progress(block, clock);
      var tasks = actionable(block, focus.blockMonday);
      var done = tasks.filter(function (task) { return checks.indexOf(task.id) >= 0; }).length;
      var urgent = left != null && left < 15 * 60;
      html += '<article class="card"><div class="meter" aria-hidden="true">' + (previewId ? "" : '<span style="width:' + (bar * 100) + '%"></span>') + '</div><div class="pad"><div class="row"><div class="row" style="gap:.5rem"><p class="label">' + (previewId ? "Preview" : "Now") + "</p>" + (block.manager ? '<span class="pill">Manager task</span>' : "") + "</div>" + (left == null ? "" : '<p class="left' + (urgent ? " hot" : "") + '">' + (left <= 0 ? "Ending" : esc(span(left)) + " left") + "</p>") + "</div>";
      html += "<h1>" + esc(block.title) + "</h1><p class=\"window\">" + esc(block.window) + "</p>";
      if (focus.next && !focus.nextWhen) {
        var remain = !focus.nextWhen && !previewId ? Math.max(0, until(focus.next.start, clock)) : null;
        html += '<div class="peek"><p class="label" style="color:var(--muted)">Up next' + (focus.nextWhen ? " · " + esc(focus.nextWhen) : "") + "</p>";
        if (remain != null) html += remainHtml(remain, waitSpan(focus.next));
        html += "<h2>" + esc(focus.next.title) + '</h2><p class="sub">' + esc(focus.next.window);
        if (focus.next.phone) html += " · <span" + (restricted(focus.next.phone.mode) ? ' style="font-weight:600;color:var(--seal)"' : "") + ">" + esc(focus.next.phone.label) + "</span>";
        html += "</p>";
        if (focus.next.tasks[0]) html += '<p style="margin-top:.5rem;font-size:.875rem;line-height:1.6">' + esc(TAG[focus.next.tasks[0].tag] + " · " + focus.next.tasks[0].text) + "</p>";
        html += "</div>";
      }
      if (block.phone) {
        var open = !restricted(block.phone.mode);
        html += '<div class="phone ' + (open ? "on" : "off") + '">' + phoneIcon(block.phone.mode, false) + '<div><p class="eyebrow">Phone</p><p class="say">' + esc(block.phone.label) + "</p></div></div>";
      }
      html += '<ul class="tasks">';
      block.tasks.forEach(function (task) { html += taskHtml(task, focus.blockMonday, interactive, clock, !previewId); });
      html += "</ul>";
      if (interactive && tasks.length) html += '<p class="tally">' + (done === tasks.length ? "Block marked clear." : done + " of " + tasks.length + " marked") + "</p>";
      if (block.id === "afternoon") html += '<p class="exit"><strong>Exit check. </strong>' + esc(EXIT) + "</p>";
      html += "</div></article>";
    }
    var nextHtml = "";
    if (focus.next && !focus.nextWhen) {
      var next = focus.next;
      var starts = !previewId ? Math.max(0, until(next.start, clock)) : null;
      nextHtml = '<aside class="next" id="up-next"><p class="label" style="color:var(--muted)">Up next</p>';
      if (starts != null) nextHtml += remainHtml(starts, waitSpan(next));
      nextHtml += "<h2>" + esc(next.title) + '</h2><p class="sub">' + esc(next.window) + "</p>";
      if (next.phone) {
        var shut = restricted(next.phone.mode);
        nextHtml += '<p class="next-phone ' + (shut ? "restricted" : "open") + '">' + phoneIcon(next.phone.mode, true) + esc(next.phone.label) + "</p>";
      }
      if (next.manager) nextHtml += '<p class="mgr">Manager task</p>';
      nextHtml += "<ul>";
      next.tasks.forEach(function (task) {
        var inactive = !!(task.mondayOnly && !focus.nextMonday);
        nextHtml += '<li class="' + (inactive ? "dim" : "") + '"><strong>' + esc(inactive ? "Mon" : TAG[task.tag]) + " · </strong>" + esc(task.text) + "</li>";
      });
      nextHtml += "</ul></aside>";
    }
    var tail = '<details class="day"><summary>Whole day ' + CHEV + '</summary><div class="day-list">';
    BLOCKS.forEach(function (block) {
      var live = block.id === nowId;
      var shown = focus.block && block.id === focus.block.id;
      tail += '<button type="button" data-pick="' + esc(block.id) + '"><span class="mark' + (live ? " live" : "") + '"></span><span class="slot">' + esc(block.window) + '</span><span><strong>' + esc(block.title) + (live ? " · now" : shown && previewId ? " · preview" : "") + "</strong>" + (block.phone ? '<span class="sub" style="display:block">' + esc(block.phone.label) + "</span>" : "") + "</span></button>";
    });
    tail += '<p class="exit" style="border:0;margin:0"><strong>Exit check. </strong>' + esc(EXIT) + "</p></div></details>";
    tail += '<p class="foot">Sheet updated Oct 29, 2026. Times follow Eastern time.</p>';
    var app = document.getElementById("app");
    var open = document.querySelector(".day[open]") != null;
    document.getElementById("lead").innerHTML = lead;
    app.innerHTML = html;
    document.getElementById("next").innerHTML = nextHtml;
    document.getElementById("tail").innerHTML = tail;
    if (open) {
      var details = document.querySelector("#tail .day");
      if (details) details.open = true;
    }
    if (seen !== nowId) {
      if (seen !== null) {
        var name = nowId ? BLOCKS.filter(function (b) { return b.id === nowId; })[0].title : "Desk closed";
        document.getElementById("live").textContent = "Now: " + name;
      }
      seen = nowId;
    }
  }

  document.querySelector("main").addEventListener("click", function (event) {
    var pick = event.target.closest("[data-pick]");
    if (pick) {
      var id = pick.getAttribute("data-pick");
      var clock = readClock(new Date());
      previewId = id === liveId(clock) ? null : (previewId === id ? null : id);
      render(clock);
      return;
    }
    if (event.target.closest("#back")) {
      previewId = null;
      render(readClock(new Date()));
      return;
    }
    var box = event.target.closest("[data-id]");
    if (box && ymd && !previewId) {
      var id = box.getAttribute("data-id");
      var next = checks.indexOf(id) >= 0 ? checks.filter(function (item) { return item !== id; }) : checks.concat([id]);
      checks = next;
      save(ymd, checks);
      render(readClock(new Date()));
    }
  });

  var lastDay = "";
  function frame() {
    var date = new Date();
    var clock = readClock(date);
    paintClock(date, clock);
    if (clock.ymd !== lastDay || clock.seconds !== frame.second || previewId !== frame.preview) {
      if (clock.ymd !== ymd) {
        ymd = clock.ymd;
        checks = load(ymd);
      }
      lastDay = clock.ymd;
      frame.second = clock.seconds;
      frame.preview = previewId;
      render(clock);
    }
    if (!reduced) requestAnimationFrame(frame);
  }
  frame.second = -1;
  frame.preview = null;
  frame();
  if (reduced) setInterval(function () { frame(); }, 1000);
})();
</script>
</body>
</html>
